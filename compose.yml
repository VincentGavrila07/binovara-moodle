services:
  moodle:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION}
        PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT}
    image: moodle-local:${MOODLE_IMAGE_TAG}
    ports:
      - "${MOODLE_PORT}:80"
    environment:
      MOODLE_WWWROOT: ${MOODLE_WWWROOT}
      MOODLE_DATA_ROOT: /var/moodledata
      MOODLE_DB_HOST: db
      MOODLE_DB_PORT: "3306"
      MOODLE_DB_NAME: ${DB_NAME}
      MOODLE_DB_USER: ${DB_USER}
      MOODLE_DB_PASSWORD: ${DB_PASSWORD}
      MOODLE_DB_PREFIX: ${DB_PREFIX}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Keep uploaded files, sessions, and Moodle cache outside the image.
      - ../moodledata:/var/moodledata

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
